inputs:
  nixpkgs:
    # url: github:cachix/devenv-nixpkgs/rolling
    # NixOS Unstable for Qt 6.10
    url: github:nixos/nixpkgs/nixos-unstable
  shared:
    url: github:pbek/nix-shared
    flake: false

  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
  - shared/common
  - shared/cpp
