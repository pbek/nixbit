<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" version="1.1" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="base" x1="0" y1="8" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d6fc4"/>
      <stop offset="1" stop-color="#22488f"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="77.5" x2="0" y2="116.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#1e9e57"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="8" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="lambda" d="M -14.81 0.85 L 3.70 32.91 L -4.80 32.99 L -9.75 24.37 L -14.72 32.94 L -18.95 32.94 L -21.11 29.20 L -14.02 17.01 L -19.06 8.25 Z"/>
  </defs>

  <!-- Soft shadow -->
  <rect x="8" y="10" width="112" height="112" rx="20" fill="#000" opacity="0.18"/>
  <rect x="8" y="9" width="112" height="112" rx="20" fill="#000" opacity="0.12"/>

  <!-- Base -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#base)"/>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#highlight)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>

  <!-- Nix snowflake -->
  <g transform="translate(64 64) scale(1.15)">
    <g transform="translate(0 1.5)" fill="#000" opacity="0.18">
      <use xlink:href="#lambda"/>
      <use xlink:href="#lambda" transform="rotate(60)"/>
      <use xlink:href="#lambda" transform="rotate(120)"/>
      <use xlink:href="#lambda" transform="rotate(180)"/>
      <use xlink:href="#lambda" transform="rotate(240)"/>
      <use xlink:href="#lambda" transform="rotate(300)"/>
    </g>
    <use xlink:href="#lambda" fill="#ffffff"/>
    <use xlink:href="#lambda" fill="#a9cdf2" transform="rotate(60)"/>
    <use xlink:href="#lambda" fill="#ffffff" transform="rotate(120)"/>
    <use xlink:href="#lambda" fill="#a9cdf2" transform="rotate(180)"/>
    <use xlink:href="#lambda" fill="#ffffff" transform="rotate(240)"/>
    <use xlink:href="#lambda" fill="#a9cdf2" transform="rotate(300)"/>
  </g>

  <!-- Update badge -->
  <circle cx="97" cy="97" r="24" fill="url(#base)"/>
  <circle cx="97" cy="98.5" r="19.5" fill="#000" opacity="0.2"/>
  <circle cx="97" cy="97" r="19.5" fill="url(#badge)"/>
  <circle cx="97" cy="97" r="19" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <g transform="translate(97 97) scale(0.93)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 9.5 -3 A 10 10 0 0 0 -8.2 -5.7"/>
    <path d="M -9.5 3 A 10 10 0 0 0 8.2 5.7"/>
    <path d="M -8.6 -11.5 L -8.2 -5.7 L -2.5 -6.3" />
    <path d="M 8.6 11.5 L 8.2 5.7 L 2.5 6.3" />
  </g>
</svg>
